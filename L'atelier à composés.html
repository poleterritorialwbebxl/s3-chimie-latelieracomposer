<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'atelier à composés</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ee;--ink:#2b2340;--card:#fff;--line:#2b2340;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1830;--ink:#fff3e0;--card:#2a2345;--line:#fff3e0}}
:root[data-theme="dark"]{--bg:#1d1830;--ink:#fff3e0;--card:#2a2345;--line:#fff3e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;line-height:1.4}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.8rem,6vw,3rem);margin:.2em 0 .1em}
h2{font-size:1.4rem;margin:28px 0 8px}
.sub{margin:0 0 12px;opacity:.8}
.box{border:2.5px solid var(--line);border-radius:18px;background:var(--card);box-shadow:5px 5px 0 var(--line);padding:16px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 12px;font:inherit;cursor:pointer;font-size:1rem}
.chip[aria-pressed=true]{background:var(--c);color:#2b2340;font-weight:600;box-shadow:3px 3px 0 var(--line)}
.chip small{opacity:.75;font-size:.75rem;margin-left:4px}
.lab{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.plus{align-self:center;font-size:2rem;font-weight:700}
.res{margin-top:18px;text-align:center;border:2.5px solid var(--line);border-radius:18px;padding:16px;background:var(--bg)}
.big{font-size:clamp(2.4rem,9vw,4rem);font-weight:700;line-height:1.1}
.big sub{font-size:.55em}
.nm{font-size:1.3rem;font-weight:600;margin-top:4px}
.steps{text-align:left;max-width:560px;margin:14px auto 0;font-size:1rem}
.steps p{margin:6px 0}
.ion{display:inline-block;border:2.5px solid var(--line);border-radius:999px;padding:1px 12px;font-weight:700;color:#2b2340}
.cat{background:#ffc94d}.an{background:#ff8fc2}
.btn{border:2.5px solid var(--line);border-radius:999px;background:#ffd23f;color:#2b2340;padding:8px 18px;font:inherit;font-weight:600;cursor:pointer}
.quiz .q{font-size:1.4rem;font-weight:600;margin:8px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:1.15rem;cursor:pointer}
.opt.ok{background:#7bd88f;color:#12351b}.opt.ko{background:#ff8a8a;color:#4a0f0f}
button:focus-visible{outline:3px solid #7b5cff;outline-offset:2px}
@media (max-width:640px){.lab{grid-template-columns:1fr}.plus{justify-self:center}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>L'atelier à composés</h1>
<p class="sub">Choisis un cation (le côté « métal ») et un groupement. L'atelier croise les valences et fabrique la formule.</p>

<div class="box">
<div class="lab">
<div><b>① Le cation</b><div class="row" id="cats" style="margin-top:8px"></div></div>
<div class="plus">+</div>
<div><b>② Le groupement</b><div class="row" id="ans" style="margin-top:8px"></div></div>
</div>
<div class="res" aria-live="polite">
<div class="big" id="formula"></div>
<div class="nm" id="name"></div>
<div class="steps" id="steps"></div>
<p><button class="btn" id="rand">🎲 Surprise-moi</button></p>
</div>
</div>

<h2>Défi : retrouve la formule</h2>
<section class="box quiz" aria-live="polite">
<b>🎯 Teste-toi</b> <span id="score">Score : 0</span>
<div class="q" id="qq"></div>
<div class="opts" id="opts"></div>
<button class="btn" style="margin-top:12px" id="next">Question suivante</button>
</section>
</main>
<script>
const R=["","I","II","III","IV"];
const M={Ag:["Argent",[1]],Hg:["Mercure",[1,2]],Cu:["Cuivre",[1,2]],Au:["Or",[1,3]],Mn:["Manganèse",[2]],Fe:["Fer",[2,3]],Cr:["Chrome",[2,3]],Co:["Cobalt",[2]],Ni:["Nickel",[2]],Pt:["Platine",[2,4]],Zn:["Zinc",[2]],Cd:["Cadmium",[2]]};
const C=[];for(const s in M)M[s][1].forEach(v=>C.push({s,n:M[s][0],v,multi:M[s][1].length>1}));
C.push({s:"NH4",n:"Ammonium",v:1,multi:false});
const A=[["OH","Hydroxyde",1],["NO2","Nitrite",1],["NO3","Nitrate",1],["ClO","Hypochlorite",1],["ClO2","Chlorite",1],["ClO3","Chlorate",1],["ClO4","Perchlorate",1],["MnO4","Permanganate",1],["CO3","Carbonate",2],["SO3","Sulfite",2],["SO4","Sulfate",2],["PO3","Phosphite",3],["PO4","Phosphate",3]].map(a=>({s:a[0],n:a[1],v:a[2]}));
const gcd=(a,b)=>b?gcd(b,a%b):a;
const sub=s=>s.replace(/\d/g,d=>"<sub>"+d+"</sub>");
const uni=s=>s.replace(/\d/g,d=>"₀₁₂₃₄₅₆₇₈₉"[d]);
function make(c,a){const g=gcd(c.v,a.v),nc=a.v/g,na=c.v/g;
const f=(sym,k,par)=>k===1?sym:(par?"("+sym+")":sym)+k;
const raw=f(c.s,nc,c.s==="NH4")+f(a.s,na,true);
const nm=a.n+(/^[AEIOU]/.test(c.n)?" d'":" de ")+c.n.toLowerCase()+(c.multi?" ("+R[c.v]+")":"");
return{raw,html:sub(raw),uni:uni(raw),nm,nc,na,g}}
let ci=0,ai=0;const cats=document.getElementById("cats"),ans=document.getElementById("ans");
const cc=["#ffc94d","#7cc4ff","#a6e36f","#b9a5ff"];
function chips(box,arr,get,cur,col){arr.forEach((x,i)=>{const b=document.createElement("button");b.className="chip";b.style.setProperty("--c",col);
b.innerHTML=uni(x.s)+"<small>"+R[x.v]+"</small>";b.setAttribute("aria-pressed","false");b.setAttribute("aria-label",x.n+", valence "+R[x.v]);
b.onclick=()=>{get(i)};box.appendChild(b)})}
chips(cats,C,i=>{ci=i;show()},0,"#ffc94d");chips(ans,A,i=>{ai=i;show()},0,"#ff8fc2");
function show(){[...cats.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===ci));[...ans.children].forEach((b,i)=>b.setAttribute("aria-pressed",i===ai));
const c=C[ci],a=A[ai],r=make(c,a);
document.getElementById("formula").innerHTML=r.html;
document.getElementById("name").textContent=r.nm;
const ch=(sym,n,sg)=>`<span class="ion ${sg==="+"?"cat":"an"}">${sub(sym)}${n>1?"<sup>"+n+sg+"</sup>":"<sup>"+sg+"</sup>"}</span>`;
document.getElementById("steps").innerHTML=
`<p>1. ${ch(c.s,c.v,"+")} a pour valence <b>${R[c.v]}</b>, ${ch(a.s,a.v,"−")} a pour valence <b>${R[a.v]}</b>.</p>
<p>2. On croise : ${sub(c.s)} reçoit l'indice <b>${r.nc}</b>, ${sub(a.s)} reçoit l'indice <b>${r.na}</b>${r.g>1?" (après simplification par "+r.g+")":""}.</p>
<p>3. Contrôle : ${r.nc} × ${R[c.v]} = <b>${r.nc*c.v}</b> et ${r.na} × ${R[a.v]} = <b>${r.na*a.v}</b> ✔ ${r.nc*c.v===r.na*a.v?"équilibré":""}</p>`}
document.getElementById("rand").onclick=()=>{ci=Math.floor(Math.random()*C.length);ai=Math.floor(Math.random()*A.length);show()};
ci=C.findIndex(c=>c.s==="Fe"&&c.v===3);ai=A.findIndex(a=>a.s==="SO4");show();
// Quiz
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let sc=0,n=0,locked=false;const qq=document.getElementById("qq"),op=document.getElementById("opts");
function ask(){locked=false;const c=rnd(C),a=rnd(A),ok=make(c,a);const set=[ok.uni];
let guard=0;while(set.length<4&&guard++<50){const t=make(rnd(C),rnd(A)).uni;if(!set.includes(t))set.push(t)}
set.sort(()=>Math.random()-.5);qq.textContent="Formule de : "+ok.nm+" ?";
op.innerHTML="";set.forEach(x=>{const b=document.createElement("button");b.className="opt";b.textContent=x;
b.onclick=()=>{if(locked)return;locked=true;n++;if(x===ok.uni){sc++;b.classList.add("ok")}else{b.classList.add("ko");[...op.children].forEach(k=>{if(k.textContent===ok.uni)k.classList.add("ok")})}
document.getElementById("score").textContent=`Score : ${sc}/${n}`};op.appendChild(b)})}
document.getElementById("next").onclick=ask;ask();
</script>
</body>
</html>
